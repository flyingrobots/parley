name: Release parley-read

# A tag `parley-read-vX.Y.Z` on main releases packages/parley-read in four jobs, each needing the one
# before:
#
#   sanity   the tag, the manifest, the whole test gate, the manifest npm would send
#   gate     packs the tarball ONCE and runs the release gate on that file (scripts/release-gate.ts):
#            the publication phase of the release-eligibility check, against the package's previous
#            release tag. It writes the release report. Nothing public exists before it passes.
#   release  the GitHub release, carrying that tarball, its digest and the report
#   publish  stages that same tarball on npm, by path, through OIDC trusted publishing (no token in
#            the repository); the owner approves the staged version before it is installable
#
# release and publish take the tarball from the gate job and compare its SHA-256 with the gate's
# output before using it; neither packs. The package version moves on its own; a release here
# publishes no schema version (spec §4.5). What the workflow cannot verify (the npm environment's
# reviewers, tag protection, what the trusted publisher allows) is in
# docs/workflows/release-parley-read.
#
# parley-read depends on @flyingrobots/parley-emit, so the version of parley-emit its range names is
# published first, and the gate proves the packed reader against that published writer in a clean
# directory. npm cannot attach a trusted publisher to a package that does not exist yet, so the
# first version is published by hand by the owner, and the publish job of that first tag fails
# until it is.

on:
  push:
    tags:
      - "parley-read-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-parley-read-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_DIR: packages/parley-read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#parley-read-v}"
          PKG_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('$PACKAGE_DIR/package.json').text()).version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) does not match $PACKAGE_DIR/package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "version $TAG_VERSION"

      - name: Verify the changelog names this version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#parley-read-v}"
          grep -q "^## \[$TAG_VERSION\]" "$PACKAGE_DIR/CHANGELOG.md" || { echo "::error::$PACKAGE_DIR/CHANGELOG.md has no heading for $TAG_VERSION"; exit 1; }

      - name: Verify package.json has the required fields
        run: |
          bun -e "
            const pkg = JSON.parse(await Bun.file('$PACKAGE_DIR/package.json').text());
            const required = ['name', 'version', 'description', 'license', 'repository', 'files', 'engines', 'publishConfig'];
            const missing = required.filter((f) => !pkg[f]);
            if (missing.length) { console.error('missing package.json fields:', missing.join(', ')); process.exit(1); }
            if (!pkg.files.length) { console.error('files is empty'); process.exit(1); }
            if (pkg.publishConfig.access !== 'public') { console.error('publishConfig.access must be public'); process.exit(1); }
            console.log('package.json fields present');
          "

      # The suite's SDL agreement test fails under CI when the pinned Wesley is missing, so the
      # release gate installs it exactly as checks.yml does (cached by exact version).
      - name: Read the Wesley pin
        id: wesley
        run: echo "version=$(bun -e "console.log(JSON.parse(await Bun.file('package.json').text()).config.wesley)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: wesley-cache
        with:
          path: ~/.wesley
          key: wesley-${{ steps.wesley.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.wesley-cache.outputs.cache-hit != 'true'
        run: cargo install wesley-cli --version "=${{ steps.wesley.outputs.version }}" --locked --root "$HOME/.wesley"
      - run: echo "$HOME/.wesley/bin" >> "$GITHUB_PATH"
      - run: test "$(wesley --version)" = "${{ steps.wesley.outputs.version }}"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run typecheck

      - name: Verify the shipped schemas match schemas/
        run: |
          cd "$PACKAGE_DIR"
          cp src/schemas.ts /tmp/schemas.before.ts
          bun run scripts/sync-schemas.ts > /dev/null
          if ! cmp -s <(grep -v '^export const SCHEMA_SOURCE' src/schemas.ts) <(grep -v '^export const SCHEMA_SOURCE' /tmp/schemas.before.ts); then
            echo "::error::src/schemas.ts is stale; run bun run sync-schemas in $PACKAGE_DIR"
            git diff --stat
            exit 1
          fi
          git checkout -- src/schemas.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the parley-emit version this range needs is on npm
        run: |
          RANGE=$(node -p "require('./$PACKAGE_DIR/package.json').dependencies['@flyingrobots/parley-emit']")
          FOUND=$(npx -y npm@latest view "@flyingrobots/parley-emit@$RANGE" version 2>/dev/null || true)
          [ -n "$FOUND" ] || { echo "::error::no published @flyingrobots/parley-emit satisfies $RANGE; publish parley-emit first"; exit 1; }
          echo "@flyingrobots/parley-emit@$RANGE resolves to $FOUND"

      - name: Verify the pack contents
        run: cd "$PACKAGE_DIR" && npm pack --dry-run

      # npm rewrites or removes manifest fields it considers invalid when it publishes, and says so
      # only as a warning (a `./`-prefixed bin path was stripped from footprint this way). The
      # published manifest must be the one in the repository, so any such correction fails here,
      # before anything is released. The gate job compares the manifest inside the one tarball it
      # packs with the repository's, and refuses a dependency range npm would send verbatim.
      - name: Verify npm publishes the manifest as written
        run: |
          cd "$PACKAGE_DIR"
          set +e
          npx -y npm@latest publish --dry-run --access public > "$RUNNER_TEMP/publish-dry-run.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/publish-dry-run.log"
          if grep -Eqi "auto-corrected|errors corrected|was invalid and removed|was changed from|was normalized|was removed" "$RUNNER_TEMP/publish-dry-run.log"; then
            echo "::error::npm would rewrite or remove part of $PACKAGE_DIR/package.json when publishing; run npm pkg fix there and commit the result"
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! grep -q "cannot publish over the previously published" "$RUNNER_TEMP/publish-dry-run.log"; then
            echo "::error::npm publish --dry-run failed (exit $status)"
            exit 1
          fi

  gate:
    needs: sanity
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.digest.outputs.file }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      # Full history and every tag: the gate compares released snapshots with the baseline and
      # with the package's previous release tag, and verifies the schema pin at its commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      # The only place a tarball is built. Exit 1 stops the workflow here: no later job runs.
      # --consumer: the packed reader and its @flyingrobots/parley-emit dependency are installed
      # from npm into a new directory outside the workspace, the step fails if the writer resolved
      # from a link or a file, and a smoke read runs there (scripts/clean-consumer.ts).
      - name: Pack once and run the release gate on that tarball
        run: bun run release-gate -- parley-read --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/release" --consumer

      - name: Print the release report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release/release-report.json" ]; then
            { echo '## Release report'; echo; echo '```json'; cat "$RUNNER_TEMP/release/release-report.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The gate wrote no release report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record the tarball's digest
        id: digest
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_OUTPUT"
          echo "file=$(cut -d' ' -f3 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      # A workflow artifact, to carry the one tarball to the jobs below. Uploaded only after the
      # gate passed.
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release-assets

      - name: Verify the tarball is the one the gate judged
        run: |
          cd release-assets
          echo "${{ needs.gate.outputs.sha256 }}  ${{ needs.gate.outputs.tarball }}" | sha256sum -c -

      - name: Extract the version and its changelog section
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#parley-read-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" "$PACKAGE_DIR/CHANGELOG.md" > "$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || echo "Release @flyingrobots/parley-read $VERSION" > "$RUNNER_TEMP/release-notes.md"

      # A re-run after a partial release finds the release already there. It is left as it is,
      # and only if the tarball it carries is this one, byte for byte.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ needs.gate.outputs.tarball }}
        run: |
          cd release-assets
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$GITHUB_REF_NAME" --pattern "$TARBALL" --dir "$RUNNER_TEMP/existing"
            cmp "$RUNNER_TEMP/existing/$TARBALL" "$TARBALL" || { echo "::error::the release $GITHUB_REF_NAME exists and carries a different $TARBALL than this run packed"; exit 1; }
            echo "the release $GITHUB_REF_NAME exists and carries this tarball"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "@flyingrobots/parley-read ${{ steps.meta.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag \
              "$TARBALL" SHA256SUMS release-report.json
          fi

  publish:
    needs: [gate, release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      # No checkout: this job has nothing to pack from. It stages a file.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release-assets

      - name: Verify the tarball is the one the gate judged
        run: |
          cd release-assets
          echo "${{ needs.gate.outputs.sha256 }}  ${{ needs.gate.outputs.tarball }}" | sha256sum -c -

      # The trusted publisher on npmjs.com allows staging only: this stages the version, and the
      # owner approves it with two-factor authentication. Given a tarball path, npm sends that
      # file's bytes and packs nothing (npm 11.15.0 or later has the command). The token this job
      # gets by OIDC can stage and nothing else: it cannot list, view or download what it staged,
      # so the comparison of the staged tarball with this one is the owner's, from the digests
      # printed below (docs/workflows/release-parley-read).
      - name: Stage that tarball on npm with OIDC provenance; the owner approves
        run: |
          TARBALL="$GITHUB_WORKSPACE/release-assets/${{ needs.gate.outputs.tarball }}"
          cd "$RUNNER_TEMP"
          set +e
          npx -y npm@latest stage publish "$TARBALL" --access public --provenance > "$RUNNER_TEMP/stage.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/stage.log"
          node -e '
            const r = require(process.argv[1]), ok = process.argv[2] === "0";
            console.log(`## ${ok ? "Staged" : "NOT staged"}: ${r.package.name}@${r.package.version}\n`);
            console.log(`The file sent to npm is \`${r.artifact.file}\`, the one the gate judged and the GitHub release carries. Before approving, compare what npm holds with:\n`);
            console.log(`| | |\n| --- | --- |\n| SHA-256 | \`${r.artifact.sha256}\` |\n| shasum (SHA-1) | \`${r.artifact.sha1}\` |\n| integrity | \`${r.artifact.integrity}\` |\n| source commit | \`${r.source.commit}\` |\n`);
          ' "$GITHUB_WORKSPACE/release-assets/release-report.json" "$status" >> "$GITHUB_STEP_SUMMARY"
          { echo '```text'; cat "$RUNNER_TEMP/stage.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
