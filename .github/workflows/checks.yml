name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Full history: the release-eligibility check (scripts/release-check.ts, run by bun test)
      # compares released snapshots with the merge base with origin/main and verifies each
      # package's schema pin at the commit it names. A shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # packages/parley-emit-py promises Python 3.9 or later, so the gate runs it on the oldest
      # version it promises; bun test shells out to python3 for its suite and its oracles. The
      # runner image ships no 3.9 for actions/setup-python, so uv installs a standalone build.
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv python install 3.9
          echo "$(dirname "$(uv python find 3.9)")" >> "$GITHUB_PATH"
      - run: python3 --version && python3 -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
      # The SDL agreement test (scripts/sdl-agreement.test.ts, transitional until
      # flyingrobots/parley#119) runs the Wesley pinned in package.json config.wesley, and under CI
      # it fails rather than skips when that binary is missing. A build from crates.io takes
      # minutes, so the binary is cached by its exact version; a new pin is a cache miss.
      - name: Read the Wesley pin
        id: wesley
        run: echo "version=$(bun -e "console.log(JSON.parse(await Bun.file('package.json').text()).config.wesley)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: wesley-cache
        with:
          path: ~/.wesley
          key: wesley-${{ steps.wesley.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.wesley-cache.outputs.cache-hit != 'true'
        run: cargo install wesley-cli --version "=${{ steps.wesley.outputs.version }}" --locked --root "$HOME/.wesley"
      - run: echo "$HOME/.wesley/bin" >> "$GITHUB_PATH"
      - run: test "$(wesley --version)" = "${{ steps.wesley.outputs.version }}"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run typecheck
  # Both packages promise Bun 1.2 or later (`engines` and their READMEs), so their own suites run
  # on the oldest version they promise. The repository's tooling under scripts/ is not part of
  # that promise and needs a newer Bun (its tests use Bun.YAML), so it is not run here.
  oldest-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun 1.2.0 cannot read this repository's lockfile (lockfileVersion 2), so the locked
      # dependencies are installed by the current Bun and the suites then run on 1.2.0.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun --version && test "$(bun --version)" = "1.2.0"
      - run: bun test packages/parley-emit/test packages/parley-read/test
