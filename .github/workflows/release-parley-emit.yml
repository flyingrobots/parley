name: Release parley-emit

# A tag `parley-emit-vX.Y.Z` on main releases packages/parley-emit: sanity checks, a GitHub
# release carrying the tarball, then publication to npm through OIDC trusted publishing (no
# token in the repository). The package version moves on its own; a release here publishes no
# schema version (spec §4.5).

on:
  push:
    tags:
      - "parley-emit-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-parley-emit-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_DIR: packages/parley-emit

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#parley-emit-v}"
          PKG_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('$PACKAGE_DIR/package.json').text()).version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) does not match $PACKAGE_DIR/package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "version $TAG_VERSION"

      - name: Verify the changelog names this version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#parley-emit-v}"
          grep -q "^## \[$TAG_VERSION\]" "$PACKAGE_DIR/CHANGELOG.md" || { echo "::error::$PACKAGE_DIR/CHANGELOG.md has no heading for $TAG_VERSION"; exit 1; }

      - name: Verify package.json has the required fields
        run: |
          bun -e "
            const pkg = JSON.parse(await Bun.file('$PACKAGE_DIR/package.json').text());
            const required = ['name', 'version', 'description', 'license', 'repository', 'files', 'engines', 'publishConfig'];
            const missing = required.filter((f) => !pkg[f]);
            if (missing.length) { console.error('missing package.json fields:', missing.join(', ')); process.exit(1); }
            if (!pkg.files.length) { console.error('files is empty'); process.exit(1); }
            if (pkg.publishConfig.access !== 'public') { console.error('publishConfig.access must be public'); process.exit(1); }
            console.log('package.json fields present');
          "

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run typecheck

      - name: Verify the shipped schemas match schemas/
        run: |
          cd "$PACKAGE_DIR"
          cp src/schemas.ts /tmp/schemas.before.ts
          bun run scripts/sync-schemas.ts > /dev/null
          if ! cmp -s <(grep -v '^export const SCHEMA_SOURCE' src/schemas.ts) <(grep -v '^export const SCHEMA_SOURCE' /tmp/schemas.before.ts); then
            echo "::error::src/schemas.ts is stale; run bun run sync-schemas in $PACKAGE_DIR"
            git diff --stat
            exit 1
          fi
          git checkout -- src/schemas.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the pack contents
        run: cd "$PACKAGE_DIR" && npm pack --dry-run

      # npm rewrites or removes manifest fields it considers invalid when it publishes, and says so
      # only as a warning (a `./`-prefixed bin path was stripped from footprint this way). The
      # published manifest must be the one in the repository, so any such correction fails here,
      # before anything is released, and so does a dependency range npm would publish verbatim.
      - name: Verify npm publishes the manifest as written
        run: |
          cd "$PACKAGE_DIR"
          set +e
          npx -y npm@latest publish --dry-run --access public > "$RUNNER_TEMP/publish-dry-run.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/publish-dry-run.log"
          if grep -Eqi "auto-corrected|errors corrected|was invalid and removed|was changed from|was normalized|was removed" "$RUNNER_TEMP/publish-dry-run.log"; then
            echo "::error::npm would rewrite or remove part of $PACKAGE_DIR/package.json when publishing; run npm pkg fix there and commit the result"
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! grep -q "cannot publish over the previously published" "$RUNNER_TEMP/publish-dry-run.log"; then
            echo "::error::npm publish --dry-run failed (exit $status)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack" > /dev/null
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/pack"
          node -e '
            const [src, packed] = process.argv.slice(1).map((p) => require(p));
            if (JSON.stringify(src) !== JSON.stringify(packed)) { console.error("the packed package.json differs from the one in the repository"); process.exit(1); }
            for (const m of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [k, v] of Object.entries(src[m] ?? {})) if (String(v).startsWith("workspace:")) { console.error(`${k}@${v} would be published verbatim`); process.exit(1); }
            }
            console.log("the packed manifest is the manifest");
          ' "$PWD/package.json" "$RUNNER_TEMP/pack/package/package.json"

  release:
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Extract the version and its changelog section
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#parley-emit-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" "$PACKAGE_DIR/CHANGELOG.md" > release-notes.md
          [ -s release-notes.md ] || echo "Release @flyingrobots/parley-emit $VERSION" > release-notes.md

      - name: Build the release tarball
        run: |
          mkdir -p release-assets
          (cd "$PACKAGE_DIR" && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets")
          (cd release-assets && sha256sum -- *.tgz > SHA256SUMS)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "@flyingrobots/parley-emit ${{ steps.meta.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag \
            release-assets/*.tgz release-assets/SHA256SUMS

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile

      - name: Publish to npm with OIDC provenance (npm 11.5.1 or later for trusted publishing)
        run: cd "$PACKAGE_DIR" && npx -y npm@latest publish --access public --provenance
